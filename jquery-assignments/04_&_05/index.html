<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basic Assignment-2</title>
    <link rel="stylesheet" href="style.css" />
    <script
      type="text/javascript"
      src="http://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">Header</header>

      <main class="content">
        <aside class="sidebar">Sidebar</aside>

        <section class="content-area">
          <article class="main-content">Main Content</article>

          <section class="extra-content">Extra Content</section>
        </section>
      </main>

      <footer class="footer">Footer</footer>

      <div class="pop-up">
        <button type="button" class="pop-up-btn">
          <img
            title="close the popup"
            aria-label="close icon"
            src="cross.svg"
            height="25"
            width="25"
            alt="cross icon"
          />
        </button>
        <p>I am popup</p>
      </div>

      <script src="index.js"></script>
    </div>
  </body>
</html>
