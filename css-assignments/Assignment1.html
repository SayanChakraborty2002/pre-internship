<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-1</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #2f2f2f;
      }
      .container {
        width: 600px;
        height: 500px;
        padding: 20px;
        background-color: #ffffff;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 1fr 2fr 1fr;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="background-color: rgb(252, 168, 182); grid-column: 1/4"></div>
      <div style="background-color: rgb(214, 121, 168); grid-column: 1/3"></div>
      <div style="background-color: rgb(197, 53, 130)"></div>
      <div style="background-color: rgb(98, 1, 59); grid-column: 1/4"></div>
    </div>
  </body>
</html>
