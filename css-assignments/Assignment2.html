<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-1</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #2f2f2f;
      }
      .container {
        width: 700px;
        height: 400px;
        padding: 20px;
        background-color: #ffffff;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 2fr 4fr 1fr 2fr;
        gap: 10px;
      }
      .stylings {
        color: white;
        text-align: center;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div
        class="stylings"
        style="background-color: rgb(93, 187, 227); grid-column: 1/5"
      >
        Header
      </div>
      <div
        class="stylings"
        style="background-color: rgb(92, 204, 63); grid-row: 2/4"
      >
        Sidebar
      </div>
      <div
        class="stylings"
        style="
          background-color: rgb(229, 213, 42);
          grid-column: 2/5;
          grid-row: 2/3;
        "
      >
        Main
      </div>
      <div
        class="stylings"
        style="
          background-color: rgb(119, 115, 116);
          grid-row: 3/4;
          grid-column: 2/5;
        "
      >
        Extra
      </div>
      <div
        class="stylings"
        style="background-color: rgb(143, 98, 0); grid-column: 1/5"
      >
        Footer
      </div>
    </div>
  </body>
</html>
