<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment-3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <section class="nav-bar">
        <a href="/home" target="_self"
          ><img
            loading="lazy"
            height="60px"
            width="80px"
            class="logo"
            src="../images/logo.png"
            alt="Logo"
        /></a>
        <nav>
          <ul>
            <li><a href="/home" target="_self">Home</a></li>
            <li><a href="/services" target="_self">Service</a></li>
            <li><a href="/profiles" target="_self">Profile</a></li>
            <li><a href="/contacts" target="_self">Contact us</a></li>
          </ul>
        </nav>
      </section>
    </header>

    <main>
      <section class="banner">
        <img src="../images/larrow.png" alt="Left-Arrow" />
        <h1>BANNER</h1>
        <img src="../images/rarrow.png" alt="Right-Arrow" />
      </section>

      <section class="main-content">
        <div class="left">
          <div class="purple-box"></div>
        </div>

        <div class="right">
          <section class="orange-box">
            <form action="/submit-page">
              <input type="text" placeholder="Enter name" />
              <input type="email" placeholder="Enter email" />
              <select>
                <option value="" disabled selected>Select an option</option>
                <option value="student">Student</option>
                <option value="developer">Developer</option></select
              ><br />
              <button type="submit">Submit</button>
            </form>
          </section>

          <div class="green-box"></div>
        </div>
      </section>
    </main>

    <footer>
      <nav class="footer-nav">
        <a href="/home">Home</a>
        <a href="/services">Service</a>
        <a href="/profiles">Profile</a>
        <a href="/contacts">Contact us</a>
      </nav>
    </footer>
  </body>
</html>
